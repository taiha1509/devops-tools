[project]
name = "inventory"
version = "0.1.0"
description = "Exercise E04 - multi-account AWS inventory"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "pydantic>=2.9",
    "boto3>=1.35",
    "pyyaml>=6.0",
]

[project.scripts]
inventory = "inventory.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "mypy>=1.13",
    "ruff>=0.8",
    "boto3-stubs[ec2,rds,lambda,sts]>=1.35",
    "types-pyyaml>=6.0",
    "moto[ec2,rds,awslambda,sts]>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inventory"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "PTH", "T20", "DTZ"]
# T20 bans print(): this tool logs, it does not print.
# DTZ bans naive datetimes: a `created_at` without a timezone is a resource you
# cannot compare across regions.

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN001", "ANN201"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
