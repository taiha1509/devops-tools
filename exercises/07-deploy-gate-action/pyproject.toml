[project]
name = "deploy-gate"
version = "0.1.0"
description = "Exercise E07 - a reusable deploy-gate GitHub Action, in Python"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.scripts]
deploy-gate = "deploy_gate.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "mypy>=1.13",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
    # Stub HTTP at the transport layer. Every gate must be testable with no
    # network and no GitHub - that is an acceptance criterion, not a nicety.
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deploy_gate"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "PTH", "T20", "DTZ"]
# DTZ matters more here than anywhere else in the track: the bash gate this
# replaces was already wrong in three repositories because it used runner-local
# time. A naive datetime in a freeze window is the actual bug being fixed.

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN001", "ANN201"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
