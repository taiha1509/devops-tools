[project]
name = "scaffolder"
version = "0.1.0"
description = "Exercise E11 - service scaffolder (the golden path)"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

# `plat new service <name>` in the brief is E10's CLI surface. This exercise ships
# the engine as its own package so it is independently testable, plus a `scaffold`
# binary for working on it alone. Wiring it into E10 is the last step - a typer
# sub-app registered as the `new` noun - and doing it that way round means the
# engine never depends on E10 being finished.
[project.scripts]
scaffold = "scaffolder.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "mypy>=1.13",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scaffolder"]

# Templates ship with the package. Without this, `scaffold` works from a git
# checkout and breaks the moment anyone installs it with `uv tool install` -
# which is the only way anyone else will ever run it.
[tool.hatch.build.targets.wheel.force-include]
"templates" = "scaffolder/templates"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "PTH", "T20", "DTZ"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN001", "ANN201"]
"src/scaffolder/cli.py" = ["T20"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    # Tests that generate a service and then run its own ruff/mypy/pytest as a
    # subprocess. Slow, and the most valuable tests in the suite - `-m "not slow"`
    # while iterating, never in CI.
    "slow: generates a project and runs its own quality bar",
]
