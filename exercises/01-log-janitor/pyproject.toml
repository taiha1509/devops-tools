[project]
name = "logjanitor"
version = "0.1.0"
description = "Exercise E01 - build-artifact janitor"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
]

[project.scripts]
logjanitor = "logjanitor.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "mypy>=1.13",
    "ruff>=0.8",
    # For the stretch goal (S3 backend). Unused until you get there.
    "boto3>=1.35",
    "boto3-stubs[s3]>=1.35",
    "moto[s3]>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/logjanitor"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "PTH", "T20", "DTZ"]
# T20 bans print(): this tool logs, it does not print.
# DTZ bans naive datetimes: age policies on naive timestamps are a real bug class.

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN001", "ANN201"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
