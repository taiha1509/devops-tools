[project]
name = "plat"
version = "0.1.0"
description = "Exercise E10 - internal platform CLI"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.scripts]
plat = "plat.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "mypy>=1.13",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
    "boto3>=1.35",
    "boto3-stubs[ec2,cloudformation]>=1.35",
    "moto[ec2,cloudformation]>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plat"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "PTH", "T20", "DTZ"]
# T20 is relaxed for cli.py alone: this tool's output *is* for humans, and
# `typer.echo` / `rich` is the right way to produce it. Everywhere else, logging.

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN001", "ANN201"]
"src/plat/cli*.py" = ["T20"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
