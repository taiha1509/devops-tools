[project]
name = "ci-matrix"
version = "0.1.0"
description = "Exercise E09 - dynamic CI matrix generator for a monorepo"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.scripts]
ci-matrix = "ci_matrix.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "mypy>=1.13",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ci_matrix"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "PTH", "T20", "DTZ"]
# T20 is on even though this tool's whole job is emitting JSON to stdout. Use the
# logger for diagnostics and one deliberate `typer.echo` for the payload - mixing
# log lines into the matrix output is how `fromJson` starts failing.

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN001", "ANN201"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
